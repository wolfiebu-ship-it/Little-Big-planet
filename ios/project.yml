# Alternative zum mitgelieferten Xcode-Projekt:
#   brew install xcodegen && cd ios && xcodegen
name: CraftWorld
options:
  bundleIdPrefix: com.craftworld
  deploymentTarget:
    iOS: "16.0"
targets:
  CraftWorld:
    type: application
    platform: iOS
    sources:
      - path: CraftWorld
        excludes: [Info.plist]
      - path: ../index.html
        buildPhase: resources
      - path: ../css
        type: folder
        buildPhase: resources
      - path: ../js
        type: folder
        buildPhase: resources
      - path: ../vendor
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.craftworld.game
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: CraftWorld/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Craft World
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
